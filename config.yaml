# =====================================================================
# Alpha screener configuration
# All numbers are STARTING POINTS. Tune them with backtest.py (see README).
# =====================================================================

universe:
  min_price: 5.0                 # exclude penny stocks
  min_dollar_volume: 10000000    # 20d avg $ volume; liquidity floor for system trade
  exclude_etfs: true
  max_tickers: null              # set an int (e.g. 1500) to cap for fast testing

prices:
  period: "2y"                   # history pulled for factor calc
  chunk_size: 150                # tickers per yfinance batch download

# Layer 2 momentum gate. Only survivors get (slow) fundamental fetch.
screen:
  rs_rank_min: 80                # keep top 20% by 6M momentum
  within_high_pct: 25            # price within 25% of 52w high
  require_uptrend: true          # price > 50ma > 200ma and 50ma rising
  vol_surge_min: 1.0             # 20d/50d avg volume ratio

# Composite weights. NOTE: the "revision momentum" factor from the original
# design is DROPPED here because free data cannot supply analyst revisions.
# Its weight was redistributed to momentum/growth.
factors:
  weights:
    momentum: 0.45
    trend: 0.15
    growth: 0.25
    quality: 0.15

report:
  top_n: 40

# Layer 5 "M": market regime filter (report still sent, just flagged).
regime:
  index: "SPY"
  ma: 200
