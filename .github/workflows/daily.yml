name: daily-alpha-screener
on:
  schedule:
    - cron: "0 22 * * 0-4"
  workflow_dispatch: {}
jobs:
  screen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - name: Run screener and email report
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
        run: python -m src.pipeline
      - name: Commit latest candidates
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/latest_candidates.json
          if git diff --staged --quiet; then
            echo "候補に変化なし。コミットをスキップ。"
          else
            git commit -m "chore: update latest_candidates.json [skip ci]"
            git push
          fi
